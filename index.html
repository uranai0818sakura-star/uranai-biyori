<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>♡ 恋の魔法診断サロン - 全占い一覧 ♡</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'M PLUS Rounded 1c', sans-serif; background: #fff0f5; color: #d63384; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 30px; border-radius: 30px; box-shadow: 0 10px 20px rgba(255, 182, 193, 0.3); }
        h1 { color: #ff4775; margin-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .menu-btn { 
            background: #ffe4e6; border: 2px solid #ffb6c1; border-radius: 15px; 
            padding: 20px 10px; cursor: pointer; color: #d63384; font-weight: bold;
            transition: 0.3s;
        }
        .menu-btn:hover { background: #ffb6c1; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>♡ 恋の魔法診断サロン ♡</h1>
        <p>気になる占いをえらんでね♪</p>
        <div class="grid" id="menu-list">
            <!-- ここにJavaScriptでボタンを生成 -->
        </div>
    </div>

    <script>
        // 100個まで増やすためのリスト
        const uranaiList = [
            { name: "今日の恋運勢", link: "uranai01.html" },
            { name: "彼の本音診断", link: "uranai02.html" },
            { name: "恋愛こじらせ度", link: "uranai03.html" },
            { name: "モテ魅力診断", link: "uranai04.html" },
            { name: "恋の引き寄せ", link: "uranai05.html" },
            // ...ここにあと95個まで増やせます
        ];

        const listDiv = document.getElementById('menu-list');
        uranaiList.forEach(u => {
            listDiv.innerHTML += `<button class="menu-btn" onclick="location.href='${u.link}'">${u.name}</button>`;
        });
    </script>
</body>
</html>
