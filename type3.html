<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スイーツで例える恋愛性格診断</title>
  <style>
    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background: linear-gradient(135deg, #ffe6fa 0%, #e0c3fc 100%);
      min-height: 100vh;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #555;
      box-sizing: border-box;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 30px 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(240, 140, 200, 0.25);
      text-align: center;
    }
    h1 {
      color: #ff6b81;
      font-size: 1.4rem;
      margin-bottom: 20px;
    }
    .q-box {
      background: #fff5f7;
      border: 1px solid #ffccd5;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: left;
    }
    .q-title {
      font-weight: bold;
      color: #ff4757;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin: 8px 0;
      font-size: 0.88rem;
      cursor: pointer;
    }
    button {
      background: #ff6b81;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }
    button:hover {
      background: #ff4757;
      transform: translateY(-2px);
    }
    #result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 16px;
      background: #f8f0ff;
      border: 2px dashed #d8b4fe;
    }
    .res-type {
      font-size: 1.3rem;
      font-weight: bold;
      color: #7b61ff;
      margin-bottom: 10px;
    }
    .res-desc {
      font-size: 0.88rem;
      line-height: 1.6;
      color: #4a4a4a;
    }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      color: #888;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>🍰 スイーツで例える恋愛性格診断 🍓</h1>

    <div id="quiz">
      <div class="q-box">
        <div class="q-title">Q1. あなたの恋のスタートは？</div>
        <label><input type="radio" name="q1" value="A"> 一目惚れが多く、すぐに気持ちが高まる</label>
        <label><input type="radio" name="q1" value="B"> じっくり時間をかけて好きになっていく</label>
      </div>

      <div class="q-box">
        <div class="q-title">Q2. 好きな人に自分をアピールするときは？</div>
        <label><input type="radio" name="q1" value="A"> 好きオーラを出して分かりやすく伝える</label>
        <label><input type="radio" name="q1" value="B"> さりげない気配りやサポートでアピール</label>
      </div>

      <div class="q-box">
        <div class="q-title">Q3. 理想のパートナーシップは？</div>
        <label><input type="radio" name="q3" value="A"> いつもドキドキ・キュンキュンしていたい</label>
        <label><input type="radio" name="q3" value="B"> 安定していてお互い高め合える関係が良い</label>
      </div>

      <button onclick="calc()">結果を見る！</button>
    </div>

    <div id="result">
      <div class="res-type" id="resType"></div>
      <div class="res-desc" id="resDesc"></div>
      <a href="index.html" class="back-btn">← トップページに戻る</a>
    </div>
  </div>

  <script>
    function calc() {
      const q1 = document.querySelector('input[name="q1"]:checked');
      const q2 = document.querySelector('input[name="q2"]:checked');
      const q3 = document.querySelector('input[name="q3"]:checked');

      if (!q1 || !q2 || !q3) {
        alert("すべての質問に答えてね！");
        return;
      }

      let aCount = 0;
      if (q1.value === 'A') aCount++;
      if (q2.value === 'A') aCount++;
      if (q3.value === 'A') aCount++;

      let type = "";
      let desc = "";

      if (aCount === 3) {
        type = "🍰 王道王様『王道いちごのショートケーキ』";
        desc = "ストレートで華やかな魅力にあふれるタイプ！誰が見てもわかりやすい可愛らしさと愛嬌で、恋の主役になれる存在です。";
      } else if (aCount === 2) {
        type = "🍮 親しみやすさNo.1『ふんわりなめらかプリン』";
        desc = "甘くてやさしく、一緒にいると心がホッとする和み系。包容力があり、気づけば相手にとって欠かせない癒やしの存在になります。";
      } else if (aCount === 1) {
        type = "🍫 濃厚ギャップ『ほろ苦ビターショコラ』";
        desc = "一見クールで大人の落ち着きがありますが、打ち解けると一気に甘い一面を見せるギャップの持ち主。噛めば噛むほど味わい深いタイプです。";
      } else {
        type = "🍵 上品で奥深い『味わい抹茶パフェ』";
        desc = "知性的で自分の芯をしっかり持ったこだわり派。一目惚れよりもじっくり育てる恋を好み、深く長く愛し合える素敵な関係を築けます。";
      }

      document.getElementById("quiz").style.display = "none";
      document.getElementById("result").style.display = "block";
      document.getElementById("resType").innerText = type;
      document.getElementById("resDesc").innerText = desc;
    }
  </script>

</body>
</html>
