<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋のLINE返信スピード診断</title>
  <style>
    body {
      font-family: 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', Meiryo, sans-serif;
      background: linear-gradient(135deg, #ffe6fa 0%, #e0c3fc 100%);
      min-height: 100vh;
      margin: 0;
      padding: 30px 15px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #555;
      box-sizing: border-box;
    }
    .container {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 30px 20px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 12px 30px rgba(240, 140, 200, 0.25);
      text-align: center;
    }
    h1 {
      color: #ff6b81;
      font-size: 1.4rem;
      margin-bottom: 20px;
    }
    .q-box {
      background: #fff5f7;
      border: 1px solid #ffccd5;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: left;
    }
    .q-title {
      font-weight: bold;
      color: #ff4757;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }
    label {
      display: block;
      margin: 8px 0;
      font-size: 0.88rem;
      cursor: pointer;
    }
    button {
      background: #ff6b81;
      color: white;
      border: none;
      padding: 12px 30px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 25px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 10px;
    }
    button:hover {
      background: #ff4757;
      transform: translateY(-2px);
    }
    #result {
      display: none;
      margin-top: 25px;
      padding: 20px;
      border-radius: 16px;
      background: #f8f0ff;
      border: 2px dashed #d8b4fe;
    }
    .res-type {
      font-size: 1.3rem;
      font-weight: bold;
      color: #7b61ff;
      margin-bottom: 10px;
    }
    .res-desc {
      font-size: 0.88rem;
      line-height: 1.6;
      color: #4a4a4a;
    }
    .back-btn {
      display: inline-block;
      margin-top: 20px;
      color: #888;
      text-decoration: none;
      font-size: 0.85rem;
    }
    .back-btn:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>💌 恋のLINE返信スピード診断 💌</h1>

    <div id="quiz">
      <div class="q-box">
        <div class="q-title">Q1. 気になる人からメッセージが届いたら？</div>
        <label><input type="radio" name="q1" value="A"> 通知を見て数分以内に即レス！</label>
        <label><input type="radio" name="q1" value="B"> 少し時間を置いてから自然に返す</label>
      </div>

      <div class="q-box">
        <div class="q-title">Q2. 既読がついてから返信が来ないと？</div>
        <label><input type="radio" name="q2" value="A"> 「何か変なこと書いたかな…」とソワソワする</label>
        <label><input type="radio" name="q2" value="B"> 「忙しいんだな」と思って自分の用事をする</label>
      </div>

      <div class="q-box">
        <div class="q-title">Q3. スタンプや絵文字の使い方は？</div>
        <label><input type="radio" name="q3" value="A"> 感情を伝えるためにたくさん使う！</label>
        <label><input type="radio" name="q3" value="B"> シンプルで読みやすい文章を意識する</label>
      </div>

      <button onclick="calc()">結果を見る！</button>
    </div>

    <div id="result">
      <div class="res-type" id="resType"></div>
      <div class="res-desc" id="resDesc"></div>
      <a href="index.html" class="back-btn">← トップページに戻る</a>
    </div>
  </div>

  <script>
    function calc() {
      const q1 = document.querySelector('input[name="q1"]:checked');
      const q2 = document.querySelector('input[name="q2"]:checked');
      const q3 = document.querySelector('input[name="q3"]:checked');

      if (!q1 || !q2 || !q3) {
        alert("すべての質問に答えてね！");
        return;
      }

      let aCount = 0;
      if (q1.value === 'A') aCount++;
      if (q2.value === 'A') aCount++;
      if (q3.value === 'A') aCount++;

      let type = "";
      let desc = "";

      if (aCount === 3) {
        type = "⚡ 爆速即レス！『超・熱中スプリンタータイプ』";
        desc = "恋をすると相手のことで頭がいっぱいになりがち。返信の速さで一途さが伝わりますが、たまには焦らして駆け引きを楽しむのも効果的です！";
      } else if (aCount === 2) {
        type = "🌸 テンポ抜群！『気配り愛されタイプ』";
        desc = "相手を不安にさせないちょうど良い返信スピード。相手のテンポに合わせるのも上手で、心地よい関係を築くことができます。";
      } else if (aCount === 1) {
        type = "☕ マイペースな『自立派クールタイプ』";
        desc = "自分の時間やペースを大切にするタイプ。相手に依存しすぎない大人の恋愛ができますが、たまに素直な好意を見せるとキュンとされます！";
      } else {
        type = "🌙 ミステリアスな『マイペース自由人タイプ』";
        desc = "返信タイミングは完全に気まぐれ。相手を少しドキドキさせるミステリアスな魅力があり、知らず知らずのうちに追いかけられるタイプです。";
      }

      document.getElementById("quiz").style.display = "none";
      document.getElementById("result").style.display = "block";
      document.getElementById("resType").innerText = type;
      document.getElementById("resDesc").innerText = desc;
    }
  </script>

</body>
</html>
